# Private Duo vhost for an existing containerized Nginx reverse proxy.
#
# Copy this file into the proxy's conf.d directory as <domain>.conf, replace
# every __DOMAIN__ with the real hostname, then validate and reload the proxy:
#
#   docker exec <proxy-container> nginx -t
#   docker exec <proxy-container> nginx -s reload
#
# The Private Duo stack must be attached to the same Docker network as the
# proxy (see deploy/docker-compose.external-proxy.yml, alias "private-duo").

server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;

    server_name __DOMAIN__;

    ssl_certificate     /etc/nginx/certs/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/__DOMAIN__/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 550m;
    client_body_timeout 900s;

    add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=()" always;

    location / {
        proxy_pass http://private-duo:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO / WebRTC signalling
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
}
