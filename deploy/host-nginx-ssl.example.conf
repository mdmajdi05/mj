server {
  listen 80;
  server_name YOUR_DOMAIN;
  location /.well-known/acme-challenge/ {
    proxy_pass http://127.0.0.1:8085;
    proxy_set_header Host $host;
  }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl http2;
  server_name YOUR_DOMAIN;
  ssl_certificate /opt/private-duo/certbot/conf/live/YOUR_DOMAIN/fullchain.pem;
  ssl_certificate_key /opt/private-duo/certbot/conf/live/YOUR_DOMAIN/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 1000m;
  client_body_timeout 1800s;
  add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=()" always;
  location / {
    proxy_pass http://127.0.0.1:8085;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_request_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
  }
}
